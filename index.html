<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Card - Live Race Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        h1 { font-size: 1.5rem; color: #38bdf8; margin-top: 0; }
        .meta { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .runner { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #334155; margin-bottom: 8px; border-radius: 8px; }
        .runner-name { font-weight: 600; font-size: 1rem; }
        .prob { font-weight: bold; color: #4ade80; font-size: 1.1rem; }
        .verdict { font-size: 0.8rem; color: #cbd5e1; margin-top: 4px; }
        .badge { background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="race-title">Loading Live Race Card...</h1>
        <div class="meta">
            <span>Status: <strong id="status" style="color:#facc15;">Connecting...</strong></span>
            <span id="last-updated">--:--:--</span>
        </div>

        <div id="runners-container">
            <div style="text-align: center; color: #94a3b8; padding: 20px;">Fetching latest prediction probabilities...</div>
        </div>
    </div>

    <script>
        // Clear local storage on boot to destroy cached stale races
        localStorage.clear();

        async function fetchLiveCard() {
            try {
                const res = await fetch('/predict');
                const data = await res.json();
                
                if (!data.live_data || !data.live_data.predictions || data.live_data.predictions.length === 0) {
                    document.getElementById('status').innerText = 'Waiting for card data';
                    return;
                }

                document.getElementById('status').innerText = 'LIVE';
                document.getElementById('status').style.color = '#4ade80';
                document.getElementById('race-title').innerText = data.live_data.race_name || 'Live Race Predictions';
                document.getElementById('last-updated').innerText = 'Updated: ' + (data.live_data.last_updated || 'Just now');

                const predictions = data.live_data.predictions;
                const analysis = data.live_data.analysis || [];
                const container = document.getElementById('runners-container');
                container.innerHTML = '';

                predictions.forEach((p, index) => {
                    const analystItem = analysis.find(a => a.runner === p.runner) || {};
                    const verdict = analystItem.verdict || 'Standard runner';

                    const row = document.createElement('div');
                    row.className = 'runner';
                    row.innerHTML = `
                        <div>
                            <div class="runner-name">${p.runner}</div>
                            <div class="verdict"><span class="badge">AI</span> ${verdict}</div>
                        </div>
                        <div class="prob">${p.win_prob}</div>
                    `;
                    container.appendChild(row);
                });
            } catch (err) {
                document.getElementById('status').innerText = 'Offline / Error';
                document.getElementById('status').style.color = '#f87171';
            }
        }

        // Poll Flask server every 5 seconds for live engine updates
        setInterval(fetchLiveCard, 5000);
        fetchLiveCard();
    </script>
</body>
</html>
